name: R analysis and manuscript
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Install document tools
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-xetex texlive-latex-recommended texlive-latex-extra lmodern
      - uses: r-lib/actions/setup-renv@v2
      - run: make check
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: manuscript
          path: ms/main.pdf
